name: Install Tavern Pocket

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract plugin and save
        run: |
          unzip -o TavernPocket_GitHub_v0.9.1.zip
          test -f manifest.json
          test -f index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Install Tavern Pocket v0.9.1"
          git push
