name: Validate 傳音玉符

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current source
        run: |
          test -f manifest.json
          test -f index.js
          node tools/build-presets.mjs
          git diff --exit-code -- presets/
          npm test
          npm run test:csb
