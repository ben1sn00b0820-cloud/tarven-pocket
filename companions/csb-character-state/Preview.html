</style></head><body><main class="preview-wrap csb"><header class="preview-top"><div class="preview-brand">◈ &nbsp; 角色信息</div><div class="preview-tag">互動預覽 · v1.5.0</div></header><div class="preview-layout"><aside class="preview-intro"><small class="csb-eyebrow">CHARACTERS. REMEMBERED.</small><h1>每一個角色，<br>都有<span>延續的故事。</span></h1><p>欄位由你定義，資料各自保存。角色暫時離場，記憶也不會離開。</p><div class="preview-buttons"><button class="csb-btn csb-primary" id="open-manager">開啟角色工坊</button><button class="csb-btn" id="open-fields">自訂欄位</button></div><div class="preview-notes"><strong>01 &nbsp; 通用與男女模板</strong><br>共用資料保留，男女欄位各自設定。<br><br><strong>02 &nbsp; 各自獨立的角色資料</strong><br>當前狀態與重要經歷，隨劇情延續。<br><br><strong>03 &nbsp; 自動生成狀態卡片</strong><br>展開姓名，查看每一項細節。</div></aside><section><div class="preview-counter" id="demo-count"></div><div class="preview-demo"><button class="csb-btn csb-small" id="simulate-rest">☕ 模擬休息</button><button class="csb-btn csb-small" id="simulate-leave">↗ 離場／重返</button><button class="csb-btn csb-small" id="reset-preview">重設預覽</button></div><div id="preview-stage"></div><p class="preview-footer">此頁使用示例角色與本機瀏覽器儲存，可實際編輯與匯出。模擬按鈕不會呼叫模型；安裝插件後才會接上酒館劇情。</p></section></div></main><script>const VERSION = 1;
const TYPES = {text:'短文字',longtext:'長文字',number:'數字',bar:'進度條',select:'單選',multiselect:'多選',boolean:'是／否'};
const POLICIES = {dynamic:'隨劇情更新',static:'初始化後固定',manual:'僅手動修改'};
const TEMPLATE_OPTIONS = {auto:'依性別自動套用',common:'通用模板',female:'女性模板',male:'男性模板'};
const FIELD_TEMPLATE_OPTIONS = {common:'通用欄位',female:'女性專用',male:'男性專用'};
const clone = value => JSON.parse(JSON.stringify(value));
const uid = (prefix='f') => `${prefix}_${globalThis.crypto?.randomUUID?.().replaceAll('-','') || (Date.now().toString(36)+Math.random().toString(36).slice(2))}`;
function field(id,label,group,type='text',options={}) {
  return {id,label,group,type,unit:'',default:null,policy:'dynamic',appliesTo:'common',hidden:false,hideEmpty:false,color:'#c7ab73',icon:'',min:0,max:100,maxDelta:null,display:'value',direction:'neutral',options:[],thresholds:[],description:'',...options};
}
/** A template is a display/update scope, never a guess based on a name or body. */
function characterTemplate(character) {
  if(['common','female','male'].includes(character?.template))return character.template;
  const gender=typeof character?.values?.gender==='string'?character.values.gender.normalize('NFKC').trim().toLocaleLowerCase():'';
  if(/^(?:女|女性|女人|female|woman)$/.test(gender))return 'female';
  if(/^(?:男|男性|男人|male|man)$/.test(gender))return 'male';
  return 'common';
}
function fieldAppliesTo(field,character) {
  const scope=field?.appliesTo??'common';
  return scope==='common'||scope===characterTemplate(character);
}
function fieldsForCharacter(schema,character,{includeHidden=false}={}) {
  return schema.fields.filter(f=>(includeHidden||!f.hidden)&&fieldAppliesTo(f,character));
}
function defaultSchema() {
  const fields = [
    field('age','年齡','basic','text',{unit:'歲',policy:'static'}),
    field('gender','性別','basic','text',{policy:'static'}),
    field('identity','身分','basic'),field('relation','與你的關係','basic'),
    field('personality','性格與背景','basic','longtext',{policy:'static'}),
    field('affection','好感度','gauges','bar',{color:'#e989a8',description:'角色對使用者的好感；依互動更新。'}),
    field('trust','信任值','gauges','bar',{color:'#ac9bf3',description:'角色對使用者的信任；不等同好感。'}),
    field('energy','精力值','gauges','bar',{color:'#d7b775',description:'越高越有活力；依休息、活動更新。'}),
    field('fatigue','疲倦值','gauges','bar',{color:'#a0aeca',direction:'negative'}),
    field('stress','壓力值','gauges','bar',{color:'#e89b7f',direction:'negative'}),
    field('satiety','飽食度','gauges','bar',{color:'#9fcda4',description:'越高越飽足；有進食或合理時間推移才更新。'}),
    field('hydration','飲水度','gauges','bar',{color:'#8acbdc',description:'水分充足程度，越高越充足。'}),
    field('lewdness','淫蕩值','gauges','bar',{color:'#c69de0',description:'成人虛構角色的性開放設定。只依明確設定或自述，不從衣著、外貌或友善推斷，未設定保持未知。'}),
    field('height','身高','features','number',{unit:'cm',min:0,max:10000,policy:'static'}),
    field('weight','體重','features','number',{unit:'kg',min:0,max:100000}),
    field('hair','髮色／髮型','features'),field('eyes','瞳色','features','text',{policy:'static'}),field('build','體型','features'),
    ...['頭部','面部','頸肩','胸部','背部','腹部','腰部','手臂','手部','腿部','足部','皮膚'].map((label,i)=>field(`part_${i}`,label,'body')),
    ...['上衣','下裝','鞋襪','配件'].map((label,i)=>field(`outfit_${i}`,label,'outfit')),
    field('outfit','整體衣著','outfit'),
    field('mood','心情','scene'),field('location','位置','scene'),field('action','行動','scene'),
    field('condition','身體狀況','scene'),field('thought','當前所想','scene','longtext',{description:'只記已表露或敘事視角允許得知的想法。'}),
    field('items','持有物品','scene','longtext'),field('note','近期變化','scene','longtext'),
    field('memory','重要經歷與約定','memory','longtext',{description:'保存仍有效的重要事件、承諾與關係背景；新增事件時保留既有重要事實，不以無關細節覆蓋。'})
  ];
  return {version:VERSION,groups:[
    {id:'basic',label:'基本資料',icon:'◇',layout:'grid',collapsed:false},
    {id:'gauges',label:'狀態數值',icon:'◈',layout:'grid',collapsed:false},
    {id:'features',label:'身體特徵',icon:'⌁',layout:'grid',collapsed:false},
    {id:'body',label:'身體部位',icon:'✧',layout:'grid',collapsed:true},
    {id:'outfit',label:'當前服裝',icon:'♧',layout:'grid',collapsed:true},
    {id:'scene',label:'當前狀態',icon:'☽',layout:'list',collapsed:false},
    {id:'memory',label:'角色記憶',icon:'▤',layout:'list',collapsed:true}
  ],fields};
}
function defaultSettings() {return {enabled:true,autoUpdate:true,autoScan:'local',autoAIApply:false,allowNew:true,showAbsent:false,inlineCards:true,mvuSync:false,promptBudget:42000,template:defaultSchema()};}
function emptyState() {return {characters:{},scene:{time:'',location:''}};}
function newDatabase(template=defaultSchema()) {return {version:VERSION,informationVersion:1,nextOrder:1,schema:clone(template),seed:emptyState(),manual:[],processed:{},locks:{},presenceOverrides:{},pinned:[],enabled:true};}
// Gender chooses a template, so a schema default must never become a recorded
// character fact or block initialization under the static-field policy.
function valueOf(character,field) {return Object.hasOwn(character.values,field.id) ? character.values[field.id] : field.id==='gender'?null:field.default;}

/** Name validation is separate from field length checks: a missing name is not a long name. */
function characterName(value, label='姓名', {strict=false}={}) {
  if(value===undefined||value===null)throw Error(`${label} 缺少 name 字串；這不是超過 100 字，請填入角色姓名或沿用已存在的角色 ID`);
  if(typeof value!=='string')throw Error(`${label} 型別錯誤：收到 ${Array.isArray(value)?'陣列':typeof value}，必須是文字，不能是物件或整份表格`);
  const name=value.trim(),length=Array.from(name).length;
  if(!name)throw Error(`${label} 不能空白`);
  if(length>100)throw Error(`${label} 實際為 ${length} 字，超過 100 字上限；疑似把正文放進 name，已略過，未截斷姓名`);
  if(strict&&(/[\r\n<>\[\]{}:：。！？!?；;，、]/u.test(name)||/^(?:角色姓名|新角色姓名|姓名|未知|未設定|無名|\{\{.*\}\})$/u.test(name)))
    throw Error(`${label} 疑似正文、標籤或模板佔位符，請只填人物的名字`);
  return name;
}

const SCAN_PRESET_FORMAT='CSB_SCAN_PRESETS';
const SCAN_PRESET_LIMIT=50;
const scanPresetBuiltins=[
  {id:'builtin-raw',name:'標準抽取 · 獨立提示',route:'raw',instructions:'',responseLength:null,builtin:true},
  {id:'builtin-host',name:'沿用酒館目前預設',route:'host',instructions:'',responseLength:null,builtin:true},

const scanPresetSaving=new WeakSet();

/** Only extraction preferences are saved here: never connections, keys or host presets. */
function validateScanPreset(input,{allowBuiltin=false}={}){
  if(!scanPresetObject(input))throw Error('掃描預設必須是物件');assertSafe(input);
  const id=input.id??uid('scanpreset');

  if(typeof input.name!=='string'||!input.name.trim()||input.name.trim().length>80)throw Error('預設名稱需為 1 至 80 字');
  if(!['raw','host'].includes(input.route))throw Error('預設生成方式需為 raw 或 host');
  const instructions=input.instructions??'';
  if(typeof instructions!=='string'||instructions.length>20000)throw Error('掃描補充提示需為 20,000 字以內的文字');
  const responseLength=input.responseLength??null;
  if(responseLength!==null&&(!Number.isSafeInteger(responseLength)||responseLength<256||responseLength>32768))throw Error('回應額度需為 256 至 32,768 的整數，或留空沿用酒館設定');

function getScanPresets(settings={}){
  const custom=settings.scanPresets??[];
  if(!Array.isArray(custom)||custom.length>SCAN_PRESET_LIMIT)throw Error(`自訂掃描預設格式錯誤，最多 ${SCAN_PRESET_LIMIT} 份`);

  });
  return [...clone(scanPresetBuiltins),...presets];
}

function resolveScanPreset(settings={},id){
  const list=getScanPresets(settings);
  if(id!==undefined&&id!==null){const preset=list.find(p=>p.id===id);if(!preset)throw Error('掃描預設已不存在，請重新選擇');return preset;}
  return list.find(p=>p.id===settings.scanPresetId)??list[0];
}

async function updateScanPresetSettings(host,mutate){
  const settings=host.settings();if(scanPresetSaving.has(settings))throw Error('正在保存掃描預設，請稍後');
  const context=host.context(),guard=host.contextGuard?.(context)??(()=>{});
  const before={scanPresets:settings.scanPresets,scanPresetId:settings.scanPresetId};
  const next={scanPresets:getScanPresets(settings).filter(p=>!p.builtin),scanPresetId:resolveScanPreset(settings).id};
  const result=mutate(next);guard();scanPresetSaving.add(settings);
  settings.scanPresets=next.scanPresets;settings.scanPresetId=next.scanPresetId;
  try{await context.saveSettingsDebounced();guard();host.onChange?.();return result;}
  catch(error){
    for(const key of Object.keys(before))if(settings[key]===next[key]){if(before[key]===undefined)delete settings[key];else settings[key]=before[key];}
    throw error;
  }finally{scanPresetSaving.delete(settings);}
}

async function saveScanPreset(host,input){
  const preset=validateScanPreset(input);
  return updateScanPresetSettings(host,next=>{
    const index=next.scanPresets.findIndex(p=>p.id===preset.id);
    if(index<0){if(next.scanPresets.length>=SCAN_PRESET_LIMIT)throw Error(`最多 ${SCAN_PRESET_LIMIT} 份自訂掃描預設`);next.scanPresets.push(preset);}

async function deleteScanPreset(host,id){

    const index=next.scanPresets.findIndex(p=>p.id===id);if(index<0)throw Error('掃描預設已不存在');

function exportScanPresets(settings={}){

const scanPresetHostRequests=new WeakSet();

      return await generate.call(context,{
        quietPrompt:`${args.systemPrompt}\n\n本次抽取資料（只依此區資料與逐字引句填表）：\n${args.prompt}`,
        quietToLoud:false,skipWIAN:false,removeReasoning:true,trimToSentence:false,
        ...(preset.responseLength===null?{}:{responseLength:preset.responseLength}),

  }

  if(typeof generate!=='function')throw Error('此酒館未提供 generateRaw；請檢查模型連線或使用本機掃描');
