</style></head><body><main class="preview-wrap csb"><header class="preview-top"><div class="preview-brand">◈ &nbsp; 角色信息</div><div class="preview-tag">互動預覽 · v1.1.0</div></header><div class="preview-layout"><aside class="preview-intro"><small class="csb-eyebrow">CHARACTERS. REMEMBERED.</small><h1>每一個角色，<br>都有<span>延續的故事。</span></h1><p>欄位由你定義，資料各自保存。角色暫時離場，記憶也不會離開。</p><div class="preview-buttons"><button class="csb-btn csb-primary" id="open-manager">開啟角色工坊</button><button class="csb-btn" id="open-fields">自訂欄位</button></div><div class="preview-notes"><strong>01 &nbsp; 一份共用模板</strong><br>身體特徵、身體部位、服裝、條狀狀態。<br><br><strong>02 &nbsp; 各自獨立的角色資料</strong><br>當前狀態與重要經歷，隨劇情延續。<br><br><strong>03 &nbsp; 自動生成狀態卡片</strong><br>展開姓名，查看每一項細節。</div></aside><section><div class="preview-counter" id="demo-count"></div><div class="preview-demo"><button class="csb-btn csb-small" id="simulate-rest">☕ 模擬休息</button><button class="csb-btn csb-small" id="simulate-leave">↗ 離場／重返</button><button class="csb-btn csb-small" id="reset-preview">重設預覽</button></div><div id="preview-stage"></div><p class="preview-footer">此頁使用示例角色與本機瀏覽器儲存，可實際編輯與匯出。模擬按鈕不會呼叫模型；安裝插件後才會接上酒館劇情。</p></section></div></main><script>const VERSION = 1;
const TYPES = {text:'短文字',longtext:'長文字',number:'數字',bar:'進度條',select:'單選',multiselect:'多選',boolean:'是／否'};
const POLICIES = {dynamic:'隨劇情更新',static:'初始化後固定',manual:'僅手動修改'};
const clone = value => JSON.parse(JSON.stringify(value));
const uid = (prefix='f') => `${prefix}_${globalThis.crypto?.randomUUID?.().replaceAll('-','') || (Date.now().toString(36)+Math.random().toString(36).slice(2))}`;
function field(id,label,group,type='text',options={}) {
  return {id,label,group,type,unit:'',default:null,policy:'dynamic',hidden:false,hideEmpty:false,color:'#c7ab73',icon:'',min:0,max:100,maxDelta:null,display:'value',direction:'neutral',options:[],thresholds:[],description:'',...options};
}
function defaultSchema() {
  const fields = [
    field('age','年齡','basic','text',{unit:'歲',policy:'static'}),
    field('gender','性別','basic','text',{policy:'static'}),
    field('identity','身分','basic'),field('relation','與你的關係','basic'),
    field('personality','性格與背景','basic','longtext',{policy:'static'}),
    field('affection','好感度','gauges','bar',{color:'#e989a8',description:'角色對使用者的好感；依互動更新。'}),
    field('trust','信任值','gauges','bar',{color:'#ac9bf3',description:'角色對使用者的信任；不等同好感。'}),
    field('energy','精力值','gauges','bar',{color:'#d7b775',description:'越高越有活力；依休息、活動更新。'}),
    field('fatigue','疲倦值','gauges','bar',{color:'#a0aeca',direction:'negative'}),
    field('stress','壓力值','gauges','bar',{color:'#e89b7f',direction:'negative'}),
    field('satiety','飽食度','gauges','bar',{color:'#9fcda4',description:'越高越飽足；有進食或合理時間推移才更新。'}),
    field('hydration','飲水度','gauges','bar',{color:'#8acbdc',description:'水分充足程度，越高越充足。'}),
    field('lewdness','淫蕩值','gauges','bar',{color:'#c69de0',description:'成人虛構角色的性開放設定。只依明確設定或自述，不從衣著、外貌或友善推斷，未設定保持未知。'}),
    field('height','身高','features','number',{unit:'cm',min:0,max:10000,policy:'static'}),
    field('weight','體重','features','number',{unit:'kg',min:0,max:100000}),
    field('hair','髮色／髮型','features'),field('eyes','瞳色','features','text',{policy:'static'}),field('build','體型','features'),
    ...['頭部','面部','頸肩','胸部','背部','腹部','腰部','手臂','手部','腿部','足部','皮膚'].map((label,i)=>field(`part_${i}`,label,'body')),
    ...['上衣','下裝','鞋襪','配件'].map((label,i)=>field(`outfit_${i}`,label,'outfit')),
    field('outfit','整體衣著','outfit'),

function elementIn(doc,tag,attrs={},...children){

    if(v===null||v===undefined||v===false)continue;
    if(k==='class')node.className=v;
    else if(k==='text')node.textContent=v;
    else if(k.startsWith('on'))node.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='checked'||k==='disabled'||k==='open'||k==='multiple')node[k]=!!v;
    else if(k==='value')node.value=v;

}

    const nodes=shown.map(c=>{const signature=JSON.stringify([c,pinned.includes(c.id)]),old=cards.get(c.id);if(old&&!schemaChanged&&old.signature===signature)return old.node;
      const node=characterCard(c,current.schema,{expanded:!!old?.node.open,pinned:pinned.includes(c.id),document:doc,onEdit:id=>{try{api.openEditor(id,{scope:current.scope});}catch(error){showError(error);}}});
      if(old){const groups=[...old.node.querySelectorAll('.csb-group')].map(g=>g.open);node.querySelectorAll('.csb-group').forEach((g,i)=>{if(groups[i]!==undefined)g.open=groups[i];});}
      cards.set(c.id,{node,signature});return node;});
    list.replaceChildren(...nodes);if(!nodes.length)list.append(e('div',{class:'csb-empty'},characters.length?'沒有符合條件的角色。':'尚未建立角色信息；可從管理介面新增或匯入。'));
    count.textContent=`${characters.filter(c=>c.present).length} 人在場 · ${characters.length} 份持久角色信息 · 顯示 ${shown.length} 人`;
  }
  function refresh(){
    if(!alive||refreshing)return;refreshing=true;
    try{
      const revision=api.getRevision?.();if(current&&revision&&revision===lastRevision)return;
      const snapshot=api.getSnapshot();
      if(!snapshot||(expectedScope!==undefined&&snapshot.scope!==expectedScope)){current=null;lastRevision='';cards.clear();list.replaceChildren();count.textContent='';inline.disabled=true;manage.disabled=true;message.textContent='請在目前聊天重新開啟角色信息。';return;}
      current=snapshot;lastRevision=revision??'';inline.disabled=false;manage.disabled=false;inline.checked=current.inlineCards!==false;message.textContent='';message.classList.remove('is-error');draw();
    }catch(error){showError(error);}finally{refreshing=false;}
  }
  search.addEventListener('input',draw);filter.addEventListener('change',draw);
  manage.addEventListener('click',()=>{try{api.openManager({scope:current?.scope});}catch(error){showError(error);}});
  inline.addEventListener('change',async()=>{inline.disabled=true;try{await api.setInlineCards(inline.checked,{scope:current?.scope});lastRevision='';refresh();}catch(error){inline.checked=current?.inlineCards!==false;showError(error);}finally{if(alive)inline.disabled=!current;}});
  const unsubscribe=api.subscribe(refresh);refresh();
  return {refresh,dispose(){if(!alive)return;alive=false;unsubscribe();cards.clear();root.remove();}};
}
