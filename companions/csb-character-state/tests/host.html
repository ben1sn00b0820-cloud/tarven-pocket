<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><style>body{margin:0;padding:12px;background:#0c1220;color:#eee;font:14px system-ui}#chat{max-width:700px;margin:auto}.mes{padding:12px;border-bottom:1px solid #444}.mes_text{white-space:pre-wrap}</style></head><body><div id="extensions_settings2"></div><div id="chat"></div><script>
const handlers={};
const events=['APP_READY','CHAT_CHANGED','CHAT_CREATED','MESSAGE_RECEIVED','MESSAGE_UPDATED','MESSAGE_DELETED','MESSAGE_SWIPED','CHARACTER_MESSAGE_RENDERED','USER_MESSAGE_RENDERED','GENERATION_STARTED','GENERATION_ENDED','GENERATION_STOPPED','MORE_MESSAGES_LOADED'];
window.hostGenerating=false;
const ctx={isGenerating:()=>window.hostGenerating,chatId:'chat-one',chat:[],chatMetadata:{},extensionSettings:{},event_types:Object.fromEntries(events.map(k=>[k,k])),eventSource:{on:(name,fn)=>(handlers[name]??=[]).push(fn),emit:async(name,...args)=>{for(const fn of handlers[name]??[])await fn(...args);}},saveMetadata:async()=>{window.saves=(window.saves??0)+1;},saveChat:async()=>{},saveSettingsDebounced:()=>{},setExtensionPrompt:(...args)=>{window.injected=args;},messageFormatting:(s)=>{const div=document.createElement('div');div.textContent=s;return div.innerHTML;}};
window.SillyTavern={getContext:()=>ctx};window.toastr={error:(s)=>{window.lastError=s;},warning:(s)=>{window.lastWarning=s;}};
window.testHost={ctx,async render(){const chat=document.querySelector('#chat');chat.replaceChildren();ctx.chat.forEach((m,i)=>{const div=document.createElement('div');div.className='mes';div.setAttribute('mesid',i);const text=document.createElement('div');text.className='mes_text';text.textContent=m.mes;div.append(text);chat.append(div);});await ctx.eventSource.emit('CHARACTER_MESSAGE_RENDERED');},async send(payload,extra={}){ctx.chat.push({name:'旁白',is_user:false,mes:'這是正常劇情。\n<CSB_UPDATE>'+JSON.stringify(payload)+'</CSB_UPDATE>',...extra});await this.render();await ctx.eventSource.emit('MESSAGE_RECEIVED',ctx.chat.length-1);}};
</script><script type="module" src="../index.js"></script></body></html>
